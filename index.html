<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8B5A2B">
  <title>打弹珠</title>
  <link rel="stylesheet" href="style.css?v=3.1.1">
</head>
<body>
  <!-- 开始页 -->
  <div id="screen-home" class="screen">
    <h1 class="title">打弹珠</h1>
    <p class="tagline">放学了，掏出兜里的弹珠——蹲下，瞄准，今天要让它们全部进洞。</p>
    <button class="btn-primary" id="btn-start">闯关模式</button>
    <button class="btn-primary" id="btn-vs">⚔ 对战 AI</button>
    <button class="btn-secondary" id="btn-skins">我的弹珠</button>
  </div>

  <!-- 选关页 -->
  <div id="screen-levels" class="screen hidden">
    <h2 class="screen-title">选关</h2>
    <div id="level-grid" class="level-grid"></div>
    <button class="btn-secondary" id="btn-back-home">返回</button>
  </div>

  <!-- 皮肤页 -->
  <div id="screen-skins" class="screen hidden">
    <h2 class="screen-title">我的弹珠</h2>
    <div id="skin-list" class="skin-list"></div>
    <button class="btn-secondary" id="btn-back-skins">返回</button>
  </div>

  <!-- 对局页 -->
  <div id="screen-game" class="screen hidden">
    <div id="game-hud">
      <button class="hud-btn" id="btn-levels">‹ 选关</button>
      <div id="hud-info"><span id="hud-level">第 1 关</span> · <span id="hud-shots">剩余 4 次</span></div>
      <button class="hud-btn" id="btn-restart">↻</button>
    </div>
    <canvas id="game-canvas"></canvas>
    <div id="game-tip" class="game-tip hidden">
      <span id="game-tip-text"></span>
    </div>
    <div id="game-overlay" class="overlay hidden">
      <div id="result-card" class="result-card">
        <h3 id="result-title">进洞！</h3>
        <div id="result-stars" class="stars"></div>
        <button class="btn-primary" id="btn-next">下一关</button>
        <button class="btn-secondary" id="btn-replay">重玩本关</button>
        <button class="btn-link" id="btn-result-levels">选关</button>
      </div>
    </div>
  </div>

  <!-- 对战页 -->
  <div id="screen-vs" class="screen hidden">
    <div id="vs-hud">
      <button class="hud-btn" id="btn-vs-home">‹ 返回</button>
      <div id="vs-scores">
        <div class="vs-pouch" id="vs-pouch-player">
          <span class="vs-pouch-label">我</span>
          <span class="vs-pouch-count" id="vs-count-player">0</span>
          <div class="vs-pouch-marbles" id="vs-marbles-player"></div>
        </div>
        <span class="vs-colon">:</span>
        <div class="vs-pouch vs-pouch-ai" id="vs-pouch-ai">
          <span class="vs-pouch-label">AI</span>
          <span class="vs-pouch-count" id="vs-count-ai">0</span>
          <div class="vs-pouch-marbles" id="vs-marbles-ai"></div>
        </div>
      </div>
      <button class="hud-btn" id="btn-vs-restart">↻</button>
    </div>
    <div id="vs-turn-banner" class="vs-turn-banner">轮到你了</div>
    <div id="vs-tutorial" class="vs-tutorial hidden">
      <div class="vs-tutorial-title">🎯 打倒赢珠规则</div>
      <div class="vs-tutorial-row">1️⃣ 从起始线用母珠撞圈内彩珠出圈 → 彩珠归你</div>
      <div class="vs-tutorial-row">2️⃣ 🎯 打中 + 母珠滚出圈 → 继续打！</div>
      <div class="vs-tutorial-row">3️⃣ ⚠️ 母珠停在圈内 → 打出的彩珠归还，回起始线</div>
      <div class="vs-tutorial-hint">（点击任意处关闭）</div>
    </div>
    <canvas id="vs-canvas"></canvas>
    <div id="vs-overlay" class="overlay hidden">
      <div id="vs-result-card" class="result-card">
        <h3 id="vs-result-title">胜利！</h3>
        <div id="vs-result-detail" class="vs-result-detail"></div>
        <button class="btn-primary" id="btn-vs-again">再战一局</button>
        <button class="btn-link" id="btn-vs-home2">返回首页</button>
      </div>
    </div>
  </div>

  <!-- 版本号（右下角，便于确认更新） -->
  <div id="version-badge">v3.1.2</div>

  <script type="module" src="src/main.js?v=3.1.1"></script>
</body>
</html>
